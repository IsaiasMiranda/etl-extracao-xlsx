[project]
name = "etl-extracao-xlsx"
version = "0.1.0"
description = "Conjunto de pipelines ETL para extração, limpeza e consolidação de planilhas Excel de medição."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["etl-boletim-medicao"]
testpaths = ["etl-boletim-medicao"]
